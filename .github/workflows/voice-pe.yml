name: Voice PE

# Pilot: SBOM and AI BOM for the Home Assistant Voice PE firmware
# (github.com/esphome/home-assistant-voice-pe), built here from its release tags
# with the ESPHome version its own CI uses. See voice-pe/README.md.

on:
  # Daily: build the latest release. Uploading an unchanged release again changes
  # nothing in Affectra.
  schedule:
    - cron: "41 5 * * *"
  # By hand, for one tag, e.g. to backfill older releases.
  workflow_dispatch:
    inputs:
      tag:
        description: Firmware tag, e.g. 26.9.0 (empty for the latest release)
        required: false
  pull_request:
    paths:
      - voice-pe/**
      - .github/workflows/voice-pe.yml

permissions:
  contents: read

env:
  FIRMWARE_REPO: esphome/home-assistant-voice-pe

jobs:
  tag:
    name: Pick the firmware tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      esphome: ${{ steps.tag.outputs.esphome }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/$FIRMWARE_REPO/releases/latest" --jq .tag_name)
          fi
          case "$TAG" in *[!A-Za-z0-9._-]*|"") echo "bad tag: $TAG"; exit 1;; esac
          # The ESPHome version the firmware's own CI builds this tag with.
          ESPHOME=$(gh api "repos/$FIRMWARE_REPO/contents/.github/workflows/build.yml?ref=$TAG" \
            --jq .content | base64 -d | sed -n 's/^ *esphome-version: *\([0-9.]*\) *$/\1/p' | head -n 1)
          case "$ESPHOME" in *[!0-9.]*|"") echo "no esphome-version in build.yml at $TAG"; exit 1;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "esphome=$ESPHOME" >> "$GITHUB_OUTPUT"
          echo "Firmware $TAG, ESPHome $ESPHOME" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build firmware, SBOM and AI BOM
    needs: tag
    runs-on: ubuntu-latest
    container: ghcr.io/esphome/esphome:${{ needs.tag.outputs.esphome }}
    permissions:
      contents: read
      id-token: write       # signs the attestations (Sigstore, no keys)
      attestations: write   # stores them in this repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.FIRMWARE_REPO }}
          ref: ${{ needs.tag.outputs.tag }}
          path: fw
          persist-credentials: false
      - name: Build
        run: sh voice-pe/build.sh fw "${{ needs.tag.outputs.tag }}"
      # GitHub attestations, keyless with Sigstore, not for pull requests: both
      # SBOMs describe exactly these firmware images. upload-sbom sends
      # <sbom>.sigstore.json with each SBOM; the AI BOM's attestation is what
      # makes a model's Shipped step on the AI models tab a verified signature.
      # They cover this repository's build of the tag, not the image Nabu Casa
      # ships (ESPHome puts the build time into the image).
      - name: Attest the firmware SBOM
        id: attest-sbom
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@v4
        with:
          subject-path: dist/voice-pe.*.bin
          sbom-path: dist/voice-pe.cdx.json
      - name: Attest the AI BOM
        id: attest-aibom
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@v4
        with:
          subject-path: dist/voice-pe.*.bin
          sbom-path: dist/voice-pe.aibom.cdx.json
      - name: Keep the attestation bundles
        if: github.event_name != 'pull_request'
        run: |
          cp "$SBOM_BUNDLE" dist/voice-pe.cdx.json.sigstore.json
          cp "$AIBOM_BUNDLE" dist/voice-pe.aibom.cdx.json.sigstore.json
        env:
          SBOM_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
          AIBOM_BUNDLE: ${{ steps.attest-aibom.outputs.bundle-path }}
      - uses: actions/upload-artifact@v7
        with:
          name: voice-pe
          path: dist/
          if-no-files-found: error

  # Runs only when the repository variables are set and Affectra trusts this
  # repository for voice-pe.yml (Trusted publishers); see voice-pe/README.md.
  upload:
    name: Upload to Affectra
    needs: [tag, build]
    if: github.event_name != 'pull_request' && vars.AFFECTRA_URL != '' && vars.VOICE_PE_ORG != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the job prove to Affectra which repository it runs in
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: voice-pe
          path: dist
      - uses: affectra/upload-sbom@5c70c08c39e71063a104398ef09a3cb40305192f # v2.3.0
        with:
          url: ${{ vars.AFFECTRA_URL }}
          organization: ${{ vars.VOICE_PE_ORG }}
          product: Home Assistant Voice PE
          variant: voice-pe
          version: ${{ needs.tag.outputs.tag }}
          # The firmware SBOM and the AI BOM, both to the same release.
          sbom: |
            dist/voice-pe.cdx.json
            dist/voice-pe.aibom.cdx.json
          build-config: dist/voice-pe.sdkconfig
