name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build firmware and SBOM
    runs-on: ubuntu-latest
    # The pinned ESPHome image: same ESPHome, PlatformIO and Python on every run.
    container: ghcr.io/esphome/esphome:2024.10.3
    permissions:
      contents: read
      id-token: write       # signs the attestations (Sigstore, no keys)
      attestations: write   # stores them in this repository
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: sh firmware/build.sh
      # GitHub attestations, keyless with Sigstore, not for pull requests
      # (README.md): which workflow and commit built the firmware, and that the
      # SBOM describes exactly these firmware files. The SBOM attestation also
      # goes to Exposa: upload-sbom sends <sbom>.sigstore.json with the SBOM.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/climate-sensor.*.bin
      - name: Attest SBOM
        id: attest-sbom
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@v4
        with:
          subject-path: dist/climate-sensor.*.bin
          sbom-path: dist/climate-sensor.cdx.json
      - name: Keep the SBOM attestation for Exposa
        if: github.event_name != 'pull_request'
        run: cp "$BUNDLE" dist/climate-sensor.cdx.json.sigstore.json
        env:
          BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
      - uses: actions/upload-artifact@v7
        with:
          name: climate-sensor
          path: dist/
          if-no-files-found: error

  # On a version tag, send the SBOM to Exposa. Runs only when the repository
  # variables EXPOSA_URL and EXPOSA_ORG are set and Exposa trusts this repository
  # (Trusted publishers); see README.md.
  upload:
    name: Upload SBOM to Exposa
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.EXPOSA_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the job prove to Exposa which repository it runs in
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: climate-sensor
          path: dist
      - uses: schmidtfx/upload-sbom@v1
        with:
          url: ${{ vars.EXPOSA_URL }}
          organization: ${{ vars.EXPOSA_ORG }}
          product: Climate Sensor
          hardware-revision: esp32dev
          version: ${{ github.ref_name }}
          sbom: dist/climate-sensor.cdx.json
